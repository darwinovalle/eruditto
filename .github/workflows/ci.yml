name: CI

# Runs on every PR (against dev/main) and on every push to dev/main.
# Each step below is a hard gate: if any fails, the PR shows a red ✗
# and (once branch protection is enabled on `dev`) cannot be merged.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Only the newest run matters — cancel stale runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: fmt · tidy · vet · build · test · vulnscan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Reads the `go` / `toolchain` directives from go.mod — the
          # go1.26.6 toolchain line auto-applies here, no manual upgrade.
          go-version-file: go.mod
          cache: true

      - name: Configure apt sources (avoid Azure mirror hang)
        # GitHub-hosted ubuntu runners point apt at azure.archive.ubuntu.com,
        # which can be unreachable and makes `apt-get update` stall until the
        # job times out (see the "Ign: http://azure.archive.ubuntu.com/..."
        # lines in the log) while archive.ubuntu.com works fine. Rewrite the
        # source files to the canonical mirror, then make apt fail fast on any
        # slow/unreachable mirror so a future flake can never hang the job.
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.list 2>/dev/null || true
          printf 'Acquire::Retries "0";\nAcquire::http::Timeout "10";\nAcquire::https::Timeout "10";\n' \
            | sudo tee /etc/apt/apt.conf.d/99fast-fail >/dev/null

      - name: Install build dependencies (CGO X11/OpenGL headers)
        # Needed to compile the Fyne CGO stack. xclip/xdotool are
        # runtime-only and not required to build or test. xvfb provides
        # a virtual X11 framebuffer so the test binaries can run: the
        # golang.design/x/hotkey package calls displayTest() in init()
        # and panics when no X server is reachable.
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev xvfb

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o build/eruditto ./cmd/eruditto

      - name: Test
        # xvfb-run provides a virtual X11 display: golang.design/x/hotkey
        # panics in init() without one, and it is imported (via the hotkeys
        # and ui packages) even by pure-logic tests.
        run: xvfb-run -a go test -count=1 -timeout 60s ./...

      - name: Test with race detector (concurrency safety)
        # Eruditto is heavily concurrent (clipboard monitor, IPC listener,
        # popup refresh). -race surfaces data races before they ship.
        run: xvfb-run -a go test -race -count=1 -timeout 120s ./internal/...

      - name: Vulnerability scan (govulncheck)
        # Hard gate: a PR cannot re-introduce a known-vulnerable dependency.
        # @latest keeps the scanner and its vuln DB current.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
